name: Azure ML Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Verify Azure Login
      run: az account show

    - name: Install dependencies
      run: |
        pip install azure-ai-ml azure-identity mlflow scikit-learn joblib numpy

    - name: Create Azure ML config
      run: |
        az ml workspace show \
          --name ${{ secrets.AZURE_WORKSPACE_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --output json > config.json

    - name: Train model
      run: python train.py --model_name iris-model

    - name: Deploy model
      run: python deploy.py
